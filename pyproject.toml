[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wallhelper"
version = "1.0.0"
description = "One new photograph a day, and the ones you kept."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jaeho Cho" }]
keywords = ["wallpaper", "hyprland", "hyprpaper", "bing", "wallhaven"]

# PyGObject is deliberately absent. `wallhelper gui` needs GTK4 and libadwaita,
# which come from the distribution (python-gobject, gtk4, libadwaita) and not
# from an index; the other five commands need nothing but the standard library,
# which is what lets the fetch sit in a systemd timer.
dependencies = []

[project.urls]
Homepage = "https://github.com/jaehho/wallhelper"

[project.scripts]
wallhelper = "wallhelper.cli:main"

[tool.setuptools.packages.find]
include = ["wallhelper*"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "C4",
  "SIM", "RUF", "PERF", "PIE", "RET", "RSE",
  "ARG", "PTH", "FLY", "PL", "TRY", "T20", "T10",
]
ignore = [
  "E501",
  "COM812", "COM819", "ISC001",
  "S101",
  # FastAPI Depends() default pattern
  "B008",
]

[tool.ruff.lint.per-file-ignores]
# CLI entry: print is the interface
"wallhelper/cli.py" = ["T201", "T203"]
